
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Mini Store</h1>

        <h2>Products</h2>

        <p>Headphones - 500 EGP</p>
        <button id="headphones">Add to Cart</button>

        <p>Bag - 300 EGP</p>
        <button id="bag">Add to Cart</button>

        <p>Mouse - 200 EGP</p>
        <button id="mouse">Add to Cart</button>

        <h2>My Cart</h2>
        <ul id="cart"></ul>

        <h3>Total: <span id="total">0</span> EGP</h3>
    </div>

    <script src="script.js"></script>
</body>
</html>
